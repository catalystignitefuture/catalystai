<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalyst Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#030914; --panel:rgba(6,20,42,.88); --neon:#00d4ff; --neon2:#2d7bff; --soft:#7df3ff;
    --ink:#dff6ff; --dim:#7f9bb8; --warn:#ff5d8f;
    --glow:0 0 10px rgba(0,212,255,.55), 0 0 26px rgba(0,212,255,.25);
    --head:"Orbitron","Eurostile","Segoe UI",system-ui,sans-serif;
    --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(ellipse at 50% 0%, #0a2145 0%, var(--bg) 60%); color:var(--ink); font:500 18px/1.45 var(--body); display:flex; flex-direction:column; overflow:hidden; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  header, main { position:relative; z-index:1; }

  /* ---------- Intro ---------- */
  #intro { position:fixed; inset:0; z-index:100; background:radial-gradient(ellipse at center,#081a38 0%,#02060f 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:opacity .4s ease, visibility .4s; }
  #intro.gone { opacity:0; visibility:hidden; }
  #intro svg { width:min(620px,92vw); height:auto; overflow:visible; }
  #intro .skip { position:absolute; bottom:24px; color:var(--dim); font-size:.85rem; opacity:0; animation:fadeIn .4s .5s forwards; }
  .hex { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .7s .05s ease forwards; }
  .hex2 { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .6s .3s ease forwards; }
  .core { opacity:0; transform-origin:300px 83px; animation:pop .35s .6s ease forwards, beat 1.6s 1s ease-in-out infinite; }
  .orbit { opacity:0; animation:fadeIn .4s .5s forwards; }
  .word { fill:transparent; stroke:var(--neon); stroke-width:1.6; stroke-dasharray:420; stroke-dashoffset:420; font:900 58px var(--head); letter-spacing:10px; animation:draw2 1s .4s ease forwards, fillIn .5s 1.2s ease forwards; }
  .tag { fill:var(--soft); font:500 18px var(--body); letter-spacing:6px; opacity:0; animation:fadeIn .5s 1.5s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes draw2 { to { stroke-dashoffset:0; } }
  @keyframes fillIn { to { fill:var(--ink); } }
  @keyframes fadeIn { to { opacity:1; } }
  @keyframes pop { from { opacity:0; transform:scale(0); } to { opacity:1; transform:scale(1); } }
  @keyframes beat { 50% { transform:scale(1.5); } }

  /* ---------- Header ---------- */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid rgba(0,212,255,.25); background:linear-gradient(180deg,rgba(0,212,255,.08),transparent); }
  .brand { display:flex; align-items:center; gap:10px; font:700 1.05rem var(--head); letter-spacing:.2em; text-shadow:var(--glow); }
  .brand svg { width:30px; height:30px; filter:drop-shadow(0 0 6px var(--neon)); }
  .pills { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border:1px solid rgba(0,212,255,.45); border-radius:999px; font-size:.9rem; color:var(--dim); background:rgba(0,212,255,.05); }
  .pill.ok { color:var(--soft); box-shadow:var(--glow); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .pill.ok .dot { background:var(--neon); box-shadow:0 0 8px var(--neon); animation:pulse 1.4s infinite; }
  #roomchip { display:none; }
  @keyframes pulse { 50% { transform:scale(1.6); opacity:.5; } }

  main { flex:1; display:flex; flex-direction:column; min-height:0; }

  /* ---------- Neon card ---------- */
  .neon { position:relative; border-radius:18px; background:var(--panel); border:1px solid rgba(0,212,255,.25); box-shadow:var(--glow), inset 0 0 30px rgba(0,212,255,.06); }

  /* ---------- Setup ---------- */
  #setup { margin:auto; width:min(440px,92vw); padding:34px 28px 28px; text-align:center; opacity:0; transform:translateY(28px) scale(.97); }
  body.ready #setup { animation:rise .5s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  #setup h2 { margin:0 0 4px; font:700 1.5rem var(--head); letter-spacing:.14em; text-shadow:var(--glow); }
  #setup p { margin:0 0 22px; color:var(--dim); }
  #setup label { display:block; text-align:left; margin:0 0 6px; color:var(--soft); font-size:.95rem; }
  input { font:inherit; color:var(--ink); background:rgba(0,10,26,.8); border:1px solid rgba(0,212,255,.4); border-radius:10px; padding:11px 14px; width:100%; transition:box-shadow .2s, border-color .2s; }
  input::placeholder { color:#4a6585; }
  input:focus { outline:none; border-color:var(--neon); box-shadow:var(--glow); }
  button { font:600 1rem var(--body); color:var(--ink); background:rgba(0,212,255,.06); border:1px solid rgba(0,212,255,.5); border-radius:10px; padding:10px 14px; cursor:pointer; transition:transform .15s, box-shadow .2s, background .2s; }
  button:hover { box-shadow:var(--glow); background:rgba(0,212,255,.14); }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:2px solid var(--soft); outline-offset:2px; }
  button.off { color:#ffd0df; border-color:var(--warn); background:rgba(255,93,143,.14); box-shadow:0 0 12px rgba(255,93,143,.4); }
  #start { width:100%; margin-top:18px; padding:13px; font:700 1.05rem var(--body); letter-spacing:.08em; color:#021019; background:var(--neon); border:none; }
  #start:hover { background:var(--soft); box-shadow:none; }
  #err { min-height:1.5em; margin-top:12px; color:var(--warn); font-size:.95rem; }

  /* ---------- Call ---------- */
  #call { display:none; flex:1; flex-direction:column; min-height:0; padding:12px 16px 16px; gap:12px; }
  #viz { width:100%; height:clamp(150px,27vh,250px); display:block; flex:none; }
  #feedwrap { flex:1; min-height:0; display:flex; flex-direction:column; padding:6px; }
  #feed { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  #feed:empty::after { content:"Say something. Your words show up here."; color:var(--dim); margin:auto; }
  .msg { max-width:85%; padding:9px 14px; border-radius:14px; border:1px solid rgba(45,123,255,.7); background:rgba(45,123,255,.1); box-shadow:0 0 12px rgba(45,123,255,.3); animation:msgIn .35s cubic-bezier(.2,.9,.3,1); overflow-wrap:anywhere; }
  .msg.me { align-self:flex-end; border-color:var(--neon); background:rgba(0,212,255,.12); box-shadow:0 0 14px rgba(0,212,255,.4); }
  .msg small { display:block; color:var(--dim); font-size:.78rem; }
  @keyframes msgIn { from { opacity:0; transform:translateY(12px) scale(.96); } }
  body.display #feed { justify-content:center; align-items:center; text-align:center; }
  body.display #feed:empty::after { font-size:1.2rem; }
  body.display .msg { max-width:96%; font:700 clamp(2rem,7vw,5rem)/1.15 var(--head); background:none; border:none; box-shadow:none; text-shadow:var(--glow); }
  body.display .msg small { display:none; }
  body.display .msg:not(:last-child) { display:none; }
  #bar { display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; margin-top:4px; }
  #text { flex:1; min-width:170px; width:auto; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; }
  #send { background:linear-gradient(90deg,var(--neon),var(--soft)); color:#021019; border:none; font-weight:700; }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<!-- Intro logo -->
<div id="intro" aria-label="Catalyst">
  <svg viewBox="0 0 600 320" role="img" aria-label="Catalyst logo">
    <defs>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <path id="orb" d="M222,83 a78,26 0 1,0 156,0 a78,26 0 1,0 -156,0"/>
    </defs>
    <g fill="none" stroke="#00d4ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <polygon class="hex" pathLength="1" points="300,22 352,52 352,114 300,144 248,114 248,52"/>
      <polygon class="hex2" pathLength="1" points="300,52 326,67 326,99 300,114 274,99 274,67" stroke="#7df3ff" stroke-width="2"/>
      <circle class="core" cx="300" cy="83" r="7" fill="#7df3ff" stroke="none"/>
      <g class="orbit" stroke-width="1.4" stroke="#2d7bff">
        <g transform="rotate(-24 300 83)"><use href="#orb"/><circle r="5" fill="#7df3ff" stroke="none"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion></circle></g>
        <g transform="rotate(36 300 83)"><use href="#orb"/><circle r="5" fill="#00d4ff" stroke="none"><animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orb"/></animateMotion></circle></g>
      </g>
      <text class="word" x="300" y="238" text-anchor="middle">CATALYST</text>
    </g>
    <text class="tag" x="300" y="286" text-anchor="middle">IGNITE FUTURE</text>
  </svg>
  <div class="skip">Tap to skip</div>
</div>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" stroke="#00d4ff" stroke-width="2.4" stroke-linejoin="round"><polygon points="20,3 34,11 34,29 20,37 6,29 6,11"/><circle cx="20" cy="20" r="3.5" fill="#7df3ff" stroke="none"/><ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(-24 20 20)" stroke-width="1.4" stroke="#2d7bff"/></svg>
    CATALYST
  </div>
  <div class="pills">
    <span class="pill" id="roomchip"></span>
    <span class="pill" id="status"><span class="dot"></span><span id="stext">Offline</span></span>
  </div>
</header>

<main>
  <section id="setup" class="neon">
    <h2>Catalyst Talk</h2>
    <p>Live voice and text between two screens.</p>
    <label for="code">Room code</label>
    <input id="code" placeholder="Same code on both sides" autocomplete="off" maxlength="24">
    <button id="start">Start</button>
    <div id="err" role="alert"></div>
  </section>

  <section id="call">
    <canvas id="viz" class="neon" aria-label="Voice activity"></canvas>
    <div id="feedwrap" class="neon"><div id="feed" aria-live="polite"></div></div>
    <div id="bar" class="neon">
      <input id="text" placeholder="Type a message, press Enter" autocomplete="off">
      <div class="tools">
        <button id="send">Send</button>
        <button id="mute">Mute mic</button>
        <button id="speak">Read aloud: off</button>
        <button id="mode">Big text</button>
        <button id="copy">Copy link</button>
      </div>
    </div>
  </section>
</main>

<audio id="remote" autoplay playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let peer, conn, localStream, room, readAloud = false;
let actx, anLocal, anRemote;

/* ---------- Intro ---------- */
function endIntro(){
  const i = $('intro');
  if (i.classList.contains('gone')) return;
  i.classList.add('gone');
  document.body.classList.add('ready');
  setTimeout(() => $('code').focus({preventScroll:true}), 450);
}
$('intro').addEventListener('click', endIntro);
setTimeout(endIntro, reduce ? 300 : 2400);

/* ---------- Animated network background ---------- */
(function(){
  const c = $('bg'), g = c.getContext('2d');
  let w, h, dpr, pts = [], last = 0;
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    const n = Math.round(Math.min(40, innerWidth * innerHeight / 26000));
    pts = Array.from({length:n}, () => ({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.35*dpr, vy:(Math.random()-.5)*.35*dpr}));
    if (reduce) frame(0);
  }
  function frame(t){
    if (!reduce) requestAnimationFrame(frame);
    if (!reduce && t - last < 33) return;      // about 30 fps is plenty for a background
    last = t;
    g.clearRect(0,0,w,h);
    if (!reduce) for (const p of pts){ p.x += p.vx; p.y += p.vy; if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1; }
    const maxD = 140 * dpr, maxD2 = maxD*maxD;
    const paths = [new Path2D(), new Path2D(), new Path2D()];
    for (let i=0;i<pts.length;i++){
      for (let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d2=dx*dx+dy*dy;
        if (d2<maxD2){
          const k = d2 < maxD2*.2 ? 0 : d2 < maxD2*.55 ? 1 : 2;
          paths[k].moveTo(pts[i].x,pts[i].y); paths[k].lineTo(pts[j].x,pts[j].y);
        }
      }
    }
    g.lineWidth = dpr;
    g.strokeStyle='rgba(0,212,255,.20)'; g.stroke(paths[0]);
    g.strokeStyle='rgba(0,212,255,.11)'; g.stroke(paths[1]);
    g.strokeStyle='rgba(0,212,255,.05)'; g.stroke(paths[2]);
    g.fillStyle='rgba(125,243,255,.7)'; g.beginPath();
    for (const p of pts){ g.moveTo(p.x+1.6*dpr,p.y); g.arc(p.x,p.y,1.6*dpr,0,6.283); }
    g.fill();
  }
  addEventListener('resize', size); size(); if (!reduce) requestAnimationFrame(frame);
})();

/* ---------- UI helpers ---------- */
function setStatus(t, ok){ $('stext').textContent = t; $('status').className = 'pill' + (ok ? ' ok' : ''); }
function showErr(t){ $('err').textContent = t; }

function addMsg(text, mine){
  const d = document.createElement('div');
  d.className = 'msg' + (mine ? ' me' : '');
  const who = document.createElement('small');
  who.textContent = mine ? 'You' : 'Them';
  const body = document.createElement('span');
  body.textContent = text;
  d.append(who, body);
  $('feed').append(d);
  $('feed').scrollTop = $('feed').scrollHeight;
  if (!mine && readAloud && 'speechSynthesis' in window){
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
}

/* ---------- Audio analysis ---------- */
function makeAnalyser(stream){
  const src = actx.createMediaStreamSource(stream);
  const an = actx.createAnalyser();
  an.fftSize = 128; an.smoothingTimeConstant = .8;
  src.connect(an);
  an.buf = new Uint8Array(an.frequencyBinCount);
  return an;
}
function level(an){
  if (!an) return 0;
  an.getByteFrequencyData(an.buf);
  let s = 0; for (const v of an.buf) s += v;
  return s / an.buf.length / 255;
}

/* ---------- Voice visualizer ---------- */
(function(){
  const c = $('viz'), g = c.getContext('2d');
  let smoothR = 0, smoothL = 0;
  function draw(t){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = c.clientHeight;
    if (!W || !H){ requestAnimationFrame(draw); return; }
    if (c.width !== W*dpr || c.height !== H*dpr){ c.width = W*dpr; c.height = H*dpr; }
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, R = Math.min(W,H)*.27;
    const lr = Math.min(1, level(anRemote)*2.6), ll = Math.min(1, level(anLocal)*2.6);
    smoothR += (lr - smoothR)*.25; smoothL += (ll - smoothL)*.25;
    const idle = reduce ? 0 : (Math.sin(t/700)+1)*.03;

    const N = 64;
    let sum = 0;
    g.beginPath();
    for (let i=0;i<N;i++){
      const a = (i/N)*Math.PI*2 - Math.PI/2;
      const bin = anRemote ? anRemote.buf[Math.floor(Math.abs(i-N/2)/(N/2)*(anRemote.buf.length-1))]/255 : 0;
      sum += bin;
      const len = 4 + (bin*1.3 + idle) * R * .9;
      g.moveTo(cx + Math.cos(a)*(R+6), cy + Math.sin(a)*(R+6));
      g.lineTo(cx + Math.cos(a)*(R+6+len), cy + Math.sin(a)*(R+6+len));
    }
    g.strokeStyle = 'rgba(0,212,255,' + (0.45 + (sum/N)*.55*2) + ')';
    g.lineWidth = 3; g.lineCap = 'round';
    g.stroke();
    // core orb (their voice)
    const orbR = R*(0.72+smoothR*.28+idle);
    const orb = g.createRadialGradient(cx,cy,0,cx,cy,R);
    orb.addColorStop(0,'rgba(125,243,255,'+(0.55+smoothR*.4)+')');
    orb.addColorStop(1,'rgba(0,212,255,0.05)');
    g.fillStyle = orb; g.beginPath(); g.arc(cx,cy,orbR,0,6.283); g.fill();
    g.beginPath(); g.arc(cx,cy,orbR,0,6.283);
    g.strokeStyle='rgba(0,212,255,.18)'; g.lineWidth=7; g.stroke();   // cheap glow
    g.strokeStyle='#00d4ff'; g.lineWidth=2; g.stroke();
    // your mic ring
    g.setLineDash([10,8]); g.lineDashOffset = -t/60;
    g.beginPath(); g.arc(cx,cy,R*.52,0,6.283);
    g.strokeStyle='rgba(45,123,255,'+(0.5+smoothL*.5)+')';
    g.lineWidth = 2 + smoothL*6; g.stroke();
    g.setLineDash([]);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ---------- Connection ---------- */
function wireData(c){
  conn = c;
  const open = () => setStatus('Connected', true);
  c.open ? open() : c.on('open', open);
  c.on('data', d => addMsg(String(d), false));
  c.on('close', () => setStatus(peer && peer.isHost ? 'Waiting for someone…' : 'Other side left'));
}
function wireCall(call){
  call.on('stream', s => {
    $('remote').srcObject = s;
    anRemote = makeAnalyser(s);
    setStatus('Connected', true);
  });
  call.on('close', () => { anRemote = null; });
}
function showCall(){
  $('setup').style.display = 'none';
  $('call').style.display = 'flex';
  $('roomchip').style.display = 'inline-flex';
  $('roomchip').textContent = 'Room: ' + room;
}
function connect(asHost){
  const id = 'catalyst-talk-' + room;
  peer = asHost ? new Peer(id) : new Peer();
  const mine = peer;
  mine.isHost = asHost;

  mine.on('error', e => {
    if (e.type === 'unavailable-id' && asHost){
      mine.destroy();
      connect(false);          // someone is already here, so join them
      return;
    }
    if (e.type === 'peer-unavailable') showErr('Could not reach the room. Try again.');
    else showErr('Connection problem: ' + e.type);
    setStatus('Error');
  });

  mine.on('open', () => {
    showCall();
    if (asHost){
      setStatus('Waiting for someone…');
    } else {
      setStatus('Connecting…');
      wireCall(mine.call(id, localStream));
      wireData(mine.connect(id, {reliable:true}));
    }
  });

  if (asHost){
    mine.on('call', call => { call.answer(localStream); wireCall(call); });
    mine.on('connection', wireData);
  }
}

async function start(){
  room = $('code').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  if (!room){ showErr('Enter a room code first.'); $('code').focus(); return; }
  showErr('');
  if (typeof Peer === 'undefined'){ showErr('Still loading. Try again in a second.'); return; }
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }, video:false
    });
  } catch (e){
    showErr('Microphone blocked. Allow mic access and open this page over https:// or localhost.');
    return;
  }
  anLocal = makeAnalyser(localStream);
  history.replaceState(null, '', '#' + room);
  connect(true);
}

function send(){
  const t = $('text').value.trim();
  if (!t || !conn || !conn.open) return;
  conn.send(t);
  addMsg(t, true);
  $('text').value = '';
}

/* ---------- Events ---------- */
$('start').addEventListener('click', start);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('send').onclick = send;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('mute').onclick = () => {
  const tr = localStream.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  $('mute').textContent = tr.enabled ? 'Mute mic' : 'Unmute mic';
  $('mute').classList.toggle('off', !tr.enabled);
};
$('speak').onclick = () => {
  readAloud = !readAloud;
  $('speak').textContent = 'Read aloud: ' + (readAloud ? 'on' : 'off');
};
$('mode').onclick = () => {
  const on = document.body.classList.toggle('display');
  $('mode').textContent = on ? 'Chat view' : 'Big text';
};
$('copy').onclick = async () => {
  const link = location.href.split('#')[0] + '#' + room;
  try { await navigator.clipboard.writeText(link); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Copy failed'; }
  setTimeout(() => $('copy').textContent = 'Copy link', 1500);
};

if (location.hash.length > 1) $('code').value = decodeURIComponent(location.hash.slice(1));
</script>
</body>
</html>
